name: hector_mobile
description: "Hector, l'assistant des électriciens sur les chantiers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État / navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Réseau / auth
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0

  intl: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  # Licence de la police, affichée dans l'application (LicenseRegistry, main.dart)
  assets:
    - assets/fonts/OFL-PlusJakartaSans.txt

  # Police embarquée, sous licence SIL Open Font License 1.1
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
