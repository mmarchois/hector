# Traductions anglaises des messages destinés à l'utilisateur. La clé est le texte français,
# tel qu'il est écrit dans le code : pas de fichier français à tenir, et un message non
# traduit s'affiche en français plutôt que sous forme de clé.

# Erreurs de l'API
"Acceptez les conditions d'utilisation pour continuer.": "Accept the terms of use to continue."
"Passage introuvable.": "Passage not found."
"Conversation introuvable.": "Conversation not found."
"Créez un compte pour enregistrer un profil.": "Create an account to save a profile."
"Hector est très sollicité en ce moment. Réessayez dans quelques heures. En cas de danger immédiat, appelez les secours (18 ou 112).": "Hector is in very high demand right now. Try again in a few hours. In case of immediate danger, call the emergency services (18 or 112)."
"Les conditions d'utilisation ont changé : relisez-les et acceptez la nouvelle version.": "The terms of use have changed: read them again and accept the new version."
"Mot de passe actuel incorrect.": "Current password is incorrect."
"Session d'invité introuvable ou expirée.": "Guest session not found or expired."
"Tour introuvable.": "Turn not found."
"Trop de comptes ouverts depuis cette connexion. Réessayez plus tard ou connectez-vous.": "Too many accounts opened from this connection. Try again later or log in."
"Un compte existe déjà avec cet email.": "An account already exists with this email."
"Vous avez atteint la limite d'utilisation des dernières 24 heures. Réessayez plus tard.": "You have reached the usage limit for the last 24 hours. Try again later."
"Vous avez atteint la limite de l'essai sans compte. Créez un compte gratuit pour continuer.": "You have reached the limit of the trial without an account. Create a free account to continue."
"Vous envoyez trop de messages à la suite. Patientez un instant.": "You are sending too many messages in a row. Wait a moment."

# Tour sans réponse
"Hector n'a pas pu répondre : le service est momentanément indisponible. Réessayez dans un instant.": "Hector could not answer: the service is temporarily unavailable. Try again in a moment."
"Hector n'a pas pu répondre à ce message à cause d'une erreur. Si elle se répète, signalez-la.": "Hector could not answer this message because of an error. If it happens again, report it."

# Réponses fixes d'Hector
"Je ne peux pas répondre à cette demande. Pour toute intervention sur une installation électrique, faites appel à un électricien qualifié.": "I can't answer this request. For any work on an electrical installation, call a qualified electrician."
"Je n'ai pas pu formuler de réponse. Pouvez-vous reformuler votre question ?": "I couldn't put an answer together. Could you rephrase your question?"
"Je n'ai pas pu formuler une réponse assez fiable à cette question. Pouvez-vous la préciser ou la reformuler ? Pour une intervention sur une installation, faites appel à un électricien qualifié.": "I couldn't put together a reliable enough answer to this question. Could you make it more specific or rephrase it? For any work on an installation, call a qualified electrician."

# Natures d'énoncés (texte de repli des blocs)
"%s : %s": "%s: %s"
"Fait sourcé": "Sourced fact"
"Ce que vous avez indiqué": "What you told me"
"Résultat de calcul": "Calculation result"
"Explication générale, non sourcée": "General explanation, unsourced"
"Hypothèse": "Hypothesis"
"Recommandation": "Recommendation"
"Information manquante": "Missing information"
"Avis rapporté": "Reported opinion"
"Attention": "Warning"

# Calculs (lot L13) : calculateurs, grandeurs, hypothèses, sources, arrondi et motifs de refus
"Calcul introuvable.": "Calculation not found."
"Calculateur inconnu.": "Unknown calculator."
"Vous lancez trop de calculs à la suite. Patientez un instant.": "You are running too many calculations in a row. Wait a moment."
"Tension aux bornes d'une résistance": "Voltage across a resistance"
"Calcule la tension à partir de la résistance et du courant qui la traverse.": "Calculates the voltage from the resistance and the current flowing through it."
"Courant dans une résistance": "Current through a resistance"
"Calcule le courant à partir de la tension et de la résistance.": "Calculates the current from the voltage and the resistance."
"Résistance d'un récepteur": "Resistance of a load"
"Calcule la résistance à partir de la tension et du courant.": "Calculates the resistance from the voltage and the current."
"Puissance active en monophasé": "Single-phase active power"
"Calcule la puissance active absorbée à partir de la tension, du courant et du facteur de puissance.": "Calculates the active power drawn from the voltage, the current and the power factor."
"Puissance active en triphasé": "Three-phase active power"
"Calcule la puissance active absorbée en triphasé équilibré à partir de la tension entre phases, du courant de ligne et du facteur de puissance.": "Calculates the active power drawn by a balanced three-phase load from the line-to-line voltage, the line current and the power factor."
"Courant absorbé en monophasé": "Single-phase current drawn"
"Calcule le courant absorbé par un récepteur à partir de sa puissance active, de la tension et du facteur de puissance.": "Calculates the current drawn by a load from its active power, the voltage and the power factor."
"Courant absorbé en triphasé": "Three-phase current drawn"
"Calcule le courant de ligne absorbé par un récepteur triphasé équilibré à partir de sa puissance active, de la tension entre phases et du facteur de puissance.": "Calculates the line current drawn by a balanced three-phase load from its active power, the line-to-line voltage and the power factor."
"Tension": "Voltage"
"Tension entre phases": "Line-to-line voltage"
"Courant": "Current"
"Courant de ligne": "Line current"
"Courant absorbé": "Current drawn"
"Courant de ligne absorbé": "Line current drawn"
"Résistance": "Resistance"
"Puissance active": "Active power"
"Puissance apparente": "Apparent power"
"Facteur de puissance": "Power factor"
"Courant continu, ou courant alternatif sur un récepteur purement résistif.": "Direct current, or alternating current on a purely resistive load."
"La résistance est supposée constante : son échauffement n'est pas pris en compte.": "The resistance is assumed constant: its heating is not taken into account."
"Régime sinusoïdal établi ; tension et courant en valeurs efficaces.": "Steady sinusoidal conditions; voltage and current as RMS values."
"Le facteur de puissance est celui que vous indiquez : aucune valeur n'est supposée.": "The power factor is the one you give: no value is assumed."
"Réseau triphasé équilibré : même courant dans les trois phases.": "Balanced three-phase system: the same current in all three phases."
"La tension est celle mesurée entre deux phases (400 V sur un réseau 230/400 V).": "The voltage is the one measured between two phases (400 V on a 230/400 V system)."
"La puissance est la puissance active absorbée : ni rendement, ni coefficient d'utilisation ou de simultanéité ne sont appliqués.": "The power is the active power drawn: no efficiency, utilisation factor or diversity factor is applied."
"Loi physique : loi d'Ohm.": "Physical law: Ohm's law."
"Loi physique : puissance active en régime sinusoïdal monophasé.": "Physical law: active power in single-phase sinusoidal conditions."
"Loi physique : puissance active d'un système triphasé équilibré en régime sinusoïdal.": "Physical law: active power of a balanced three-phase system in sinusoidal conditions."
"Arrondi au plus proche, à quatre chiffres significatifs ; la partie entière n'est jamais arrondie.": "Rounded to the nearest value, to four significant figures; the integer part is never rounded."
"Arrondi par excès, à quatre chiffres significatifs ; la partie entière n'est jamais arrondie. Un courant à prévoir ne se sous-estime pas.": "Rounded up, to four significant figures; the integer part is never rounded. A current to plan for must not be underestimated."
"Entrée inconnue pour ce calcul : %key%.": "Unknown input for this calculation: %key%."
"%input% (%symbol%) : valeur manquante.": "%input% (%symbol%): value missing."
"%input% (%symbol%) : la valeur doit être un nombre.": "%input% (%symbol%): the value must be a number."
"%input% (%symbol%) : indiquez l'unité (%units%).": "%input% (%symbol%): give the unit (%units%)."
"%input% (%symbol%) : l'unité « %unit% » ne convient pas (%units%).": "%input% (%symbol%): the unit “%unit%” does not fit (%units%)."
"%input% (%symbol%) : c'est un nombre sans unité.": "%input% (%symbol%): this is a number without a unit."
"%input% (%symbol%) : la valeur doit être supérieure à %bound%%unit%.": "%input% (%symbol%): the value must be greater than %bound%%unit%."
"%input% (%symbol%) : la valeur ne doit pas dépasser %bound%%unit%, limite de ce calcul.": "%input% (%symbol%): the value must not exceed %bound%%unit%, the limit of this calculation."
"Le résultat dépasse %bound%%unit%, limite de ce calcul : vérifiez les valeurs saisies.": "The result exceeds %bound%%unit%, the limit of this calculation: check the values entered."
"Le résultat est trop petit pour être exprimé en %unit% : vérifiez les valeurs saisies.": "The result is too small to be expressed in %unit%: check the values entered."
