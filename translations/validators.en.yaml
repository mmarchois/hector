# Traductions anglaises des messages de validation (config/validator). La clé est le texte
# français de la contrainte.
"Acceptez les conditions d'utilisation pour continuer.": "Accept the terms of use to continue."
"Cet email n'est pas valide.": "This email is not valid."
"Écrivez votre message.": "Write your message."
"Format attendu : FR suivi de 11 chiffres.": "Expected format: FR followed by 11 digits."
"Identifiant de message invalide.": "Invalid message identifier."
"La page commence à 1.": "Pages start at 1."
"Le mot de passe doit contenir au moins 8 caractères.": "The password must be at least 8 characters long."
"Le nombre de messages par page va de {{ min }} à {{ max }}.": "The number of messages per page ranges from {{ min }} to {{ max }}."
"Le SIRET doit contenir 14 chiffres.": "The SIRET number must have 14 digits."
"Saisissez le nom de votre entreprise.": "Enter your company name."
"Saisissez un mot de passe.": "Enter a password."
"Saisissez votre email.": "Enter your email."
"Saisissez votre nom.": "Enter your name."
"Saisissez votre numéro de TVA.": "Enter your VAT number."
"Saisissez votre SIRET.": "Enter your SIRET number."
"Session d'invité manquante.": "Guest session is missing."
"Votre message ne doit pas dépasser {{ limit }} caractères.": "Your message must not exceed {{ limit }} characters."
