# Traductions allemandes des messages destinés à l'utilisateur. La clé est le texte français,
# tel qu'il est écrit dans le code (voir messages.en.yaml).

# Erreurs de l'API
"Acceptez les conditions d'utilisation pour continuer.": "Akzeptieren Sie die Nutzungsbedingungen, um fortzufahren."
"Passage introuvable.": "Textstelle nicht gefunden."
"Conversation introuvable.": "Unterhaltung nicht gefunden."
"Créez un compte pour enregistrer un profil.": "Erstellen Sie ein Konto, um ein Profil zu speichern."
"Hector est très sollicité en ce moment. Réessayez dans quelques heures. En cas de danger immédiat, appelez les secours (18 ou 112).": "Hector ist im Moment stark ausgelastet. Versuchen Sie es in einigen Stunden erneut. Rufen Sie bei unmittelbarer Gefahr den Notruf (18 oder 112)."
"Les conditions d'utilisation ont changé : relisez-les et acceptez la nouvelle version.": "Die Nutzungsbedingungen haben sich geändert: Lesen Sie sie erneut und akzeptieren Sie die neue Fassung."
"Mot de passe actuel incorrect.": "Das aktuelle Passwort ist falsch."
"Session d'invité introuvable ou expirée.": "Gastsitzung nicht gefunden oder abgelaufen."
"Tour introuvable.": "Anfrage nicht gefunden."
"Trop de comptes ouverts depuis cette connexion. Réessayez plus tard ou connectez-vous.": "Von dieser Verbindung wurden zu viele Konten eröffnet. Versuchen Sie es später erneut oder melden Sie sich an."
"Un compte existe déjà avec cet email.": "Mit dieser E-Mail-Adresse besteht bereits ein Konto."
"Vous avez atteint la limite d'utilisation des dernières 24 heures. Réessayez plus tard.": "Sie haben das Nutzungslimit der letzten 24 Stunden erreicht. Versuchen Sie es später erneut."
"Vous avez atteint la limite de l'essai sans compte. Créez un compte gratuit pour continuer.": "Sie haben das Limit der Testnutzung ohne Konto erreicht. Erstellen Sie ein kostenloses Konto, um fortzufahren."
"Vous envoyez trop de messages à la suite. Patientez un instant.": "Sie senden zu viele Nachrichten hintereinander. Warten Sie einen Moment."

# Tour sans réponse
"Hector n'a pas pu répondre : le service est momentanément indisponible. Réessayez dans un instant.": "Hector konnte nicht antworten: Der Dienst ist vorübergehend nicht verfügbar. Versuchen Sie es gleich noch einmal."
"Hector n'a pas pu répondre à ce message à cause d'une erreur. Si elle se répète, signalez-la.": "Hector konnte wegen eines Fehlers nicht auf diese Nachricht antworten. Tritt er erneut auf, melden Sie ihn bitte."

# Réponses fixes d'Hector
"Je ne peux pas répondre à cette demande. Pour toute intervention sur une installation électrique, faites appel à un électricien qualifié.": "Diese Anfrage kann ich nicht beantworten. Wenden Sie sich für alle Arbeiten an einer elektrischen Anlage an eine Elektrofachkraft."
"Je n'ai pas pu formuler de réponse. Pouvez-vous reformuler votre question ?": "Ich konnte keine Antwort formulieren. Können Sie Ihre Frage anders formulieren?"
"Je n'ai pas pu formuler une réponse assez fiable à cette question. Pouvez-vous la préciser ou la reformuler ? Pour une intervention sur une installation, faites appel à un électricien qualifié.": "Ich konnte auf diese Frage keine ausreichend zuverlässige Antwort formulieren. Können Sie sie genauer stellen oder anders formulieren? Wenden Sie sich für Arbeiten an einer Anlage an eine Elektrofachkraft."

# Natures d'énoncés (texte de repli des blocs)
"%s : %s": "%s: %s"
"Fait sourcé": "Belegte Tatsache"
"Ce que vous avez indiqué": "Ihre Angabe"
"Résultat de calcul": "Berechnungsergebnis"
"Explication générale, non sourcée": "Allgemeine Erklärung, ohne Quelle"
"Hypothèse": "Vermutung"
"Recommandation": "Empfehlung"
"Information manquante": "Fehlende Angabe"
"Avis rapporté": "Wiedergegebene Meinung"
"Attention": "Achtung"

# Calculs (lot L13) : calculateurs, grandeurs, hypothèses, sources, arrondi et motifs de refus
"Calcul introuvable.": "Berechnung nicht gefunden."
"Calculateur inconnu.": "Unbekannter Rechner."
"Vous lancez trop de calculs à la suite. Patientez un instant.": "Sie starten zu viele Berechnungen hintereinander. Warten Sie einen Moment."
"Tension aux bornes d'une résistance": "Spannung an einem Widerstand"
"Calcule la tension à partir de la résistance et du courant qui la traverse.": "Berechnet die Spannung aus dem Widerstand und dem Strom, der durch ihn fließt."
"Courant dans une résistance": "Strom durch einen Widerstand"
"Calcule le courant à partir de la tension et de la résistance.": "Berechnet den Strom aus der Spannung und dem Widerstand."
"Résistance d'un récepteur": "Widerstand eines Verbrauchers"
"Calcule la résistance à partir de la tension et du courant.": "Berechnet den Widerstand aus der Spannung und dem Strom."
"Puissance active en monophasé": "Einphasige Wirkleistung"
"Calcule la puissance active absorbée à partir de la tension, du courant et du facteur de puissance.": "Berechnet die aufgenommene Wirkleistung aus Spannung, Strom und Leistungsfaktor."
"Puissance active en triphasé": "Dreiphasige Wirkleistung"
"Calcule la puissance active absorbée en triphasé équilibré à partir de la tension entre phases, du courant de ligne et du facteur de puissance.": "Berechnet die aufgenommene Wirkleistung eines symmetrischen Drehstromverbrauchers aus Außenleiterspannung, Leiterstrom und Leistungsfaktor."
"Courant absorbé en monophasé": "Aufgenommener Strom, einphasig"
"Calcule le courant absorbé par un récepteur à partir de sa puissance active, de la tension et du facteur de puissance.": "Berechnet den von einem Verbraucher aufgenommenen Strom aus seiner Wirkleistung, der Spannung und dem Leistungsfaktor."
"Courant absorbé en triphasé": "Aufgenommener Strom, dreiphasig"
"Calcule le courant de ligne absorbé par un récepteur triphasé équilibré à partir de sa puissance active, de la tension entre phases et du facteur de puissance.": "Berechnet den von einem symmetrischen Drehstromverbraucher aufgenommenen Leiterstrom aus seiner Wirkleistung, der Außenleiterspannung und dem Leistungsfaktor."
"Tension": "Spannung"
"Tension entre phases": "Außenleiterspannung"
"Courant": "Strom"
"Courant de ligne": "Leiterstrom"
"Courant absorbé": "Aufgenommener Strom"
"Courant de ligne absorbé": "Aufgenommener Leiterstrom"
"Résistance": "Widerstand"
"Puissance active": "Wirkleistung"
"Puissance apparente": "Scheinleistung"
"Facteur de puissance": "Leistungsfaktor"
"Courant continu, ou courant alternatif sur un récepteur purement résistif.": "Gleichstrom oder Wechselstrom an einem rein ohmschen Verbraucher."
"La résistance est supposée constante : son échauffement n'est pas pris en compte.": "Der Widerstand wird als konstant angenommen: Seine Erwärmung wird nicht berücksichtigt."
"Régime sinusoïdal établi ; tension et courant en valeurs efficaces.": "Eingeschwungener sinusförmiger Zustand; Spannung und Strom als Effektivwerte."
"Le facteur de puissance est celui que vous indiquez : aucune valeur n'est supposée.": "Der Leistungsfaktor ist der von Ihnen angegebene: Es wird kein Wert angenommen."
"Réseau triphasé équilibré : même courant dans les trois phases.": "Symmetrisches Drehstromnetz: gleicher Strom in allen drei Außenleitern."
"La tension est celle mesurée entre deux phases (400 V sur un réseau 230/400 V).": "Die Spannung ist die zwischen zwei Außenleitern gemessene (400 V in einem 230/400-V-Netz)."
"La puissance est la puissance active absorbée : ni rendement, ni coefficient d'utilisation ou de simultanéité ne sont appliqués.": "Die Leistung ist die aufgenommene Wirkleistung: Weder Wirkungsgrad noch Auslastungs- oder Gleichzeitigkeitsfaktor werden angewendet."
"Loi physique : loi d'Ohm.": "Physikalisches Gesetz: ohmsches Gesetz."
"Loi physique : puissance active en régime sinusoïdal monophasé.": "Physikalisches Gesetz: Wirkleistung bei einphasigem sinusförmigem Wechselstrom."
"Loi physique : puissance active d'un système triphasé équilibré en régime sinusoïdal.": "Physikalisches Gesetz: Wirkleistung eines symmetrischen Drehstromsystems bei sinusförmigem Verlauf."
"Arrondi au plus proche, à quatre chiffres significatifs ; la partie entière n'est jamais arrondie.": "Auf vier signifikante Stellen zum nächsten Wert gerundet; der ganzzahlige Teil wird nie gerundet."
"Arrondi par excès, à quatre chiffres significatifs ; la partie entière n'est jamais arrondie. Un courant à prévoir ne se sous-estime pas.": "Auf vier signifikante Stellen aufgerundet; der ganzzahlige Teil wird nie gerundet. Ein einzuplanender Strom wird nicht unterschätzt."
"Entrée inconnue pour ce calcul : %key%.": "Unbekannte Eingabe für diese Berechnung: %key%."
"%input% (%symbol%) : valeur manquante.": "%input% (%symbol%): Wert fehlt."
"%input% (%symbol%) : la valeur doit être un nombre.": "%input% (%symbol%): Der Wert muss eine Zahl sein."
"%input% (%symbol%) : indiquez l'unité (%units%).": "%input% (%symbol%): Geben Sie die Einheit an (%units%)."
"%input% (%symbol%) : l'unité « %unit% » ne convient pas (%units%).": "%input% (%symbol%): Die Einheit „%unit%“ passt nicht (%units%)."
"%input% (%symbol%) : c'est un nombre sans unité.": "%input% (%symbol%): Das ist eine Zahl ohne Einheit."
"%input% (%symbol%) : la valeur doit être supérieure à %bound%%unit%.": "%input% (%symbol%): Der Wert muss größer als %bound%%unit% sein."
"%input% (%symbol%) : la valeur ne doit pas dépasser %bound%%unit%, limite de ce calcul.": "%input% (%symbol%): Der Wert darf %bound%%unit% nicht überschreiten, die Grenze dieser Berechnung."
"Le résultat dépasse %bound%%unit%, limite de ce calcul : vérifiez les valeurs saisies.": "Das Ergebnis überschreitet %bound%%unit%, die Grenze dieser Berechnung: Prüfen Sie die eingegebenen Werte."
"Le résultat est trop petit pour être exprimé en %unit% : vérifiez les valeurs saisies.": "Das Ergebnis ist zu klein, um in %unit% ausgedrückt zu werden: Prüfen Sie die eingegebenen Werte."
