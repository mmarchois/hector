"Résultat de calcul": "Berechnungsergebnis"
"Explication générale, non sourcée": "Allgemeine Erklärung, ohne Quelle"
"Hypothèse": "Vermutung"
"Recommandation": "Empfehlung"
"Information manquante": "Fehlende Angabe"
"Avis rapporté": "Wiedergegebene Meinung"
"Attention": "Achtung"
