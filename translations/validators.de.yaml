# Traductions allemandes des messages de validation (config/validator). La clé est le texte
# français de la contrainte.
"Acceptez les conditions d'utilisation pour continuer.": "Akzeptieren Sie die Nutzungsbedingungen, um fortzufahren."
"Cet email n'est pas valide.": "Diese E-Mail-Adresse ist ungültig."
"Écrivez votre message.": "Schreiben Sie Ihre Nachricht."
"Format attendu : FR suivi de 11 chiffres.": "Erwartetes Format: FR gefolgt von 11 Ziffern."
"Identifiant de message invalide.": "Ungültige Nachrichtenkennung."
"La page commence à 1.": "Die Seitenzählung beginnt bei 1."
"Le mot de passe doit contenir au moins 8 caractères.": "Das Passwort muss mindestens 8 Zeichen lang sein."
"Le nombre de messages par page va de {{ min }} à {{ max }}.": "Die Anzahl der Nachrichten pro Seite liegt zwischen {{ min }} und {{ max }}."
"Le SIRET doit contenir 14 chiffres.": "Die SIRET-Nummer muss 14 Ziffern haben."
"Saisissez le nom de votre entreprise.": "Geben Sie den Namen Ihres Unternehmens ein."
"Saisissez un mot de passe.": "Geben Sie ein Passwort ein."
"Saisissez votre email.": "Geben Sie Ihre E-Mail-Adresse ein."
"Saisissez votre nom.": "Geben Sie Ihren Namen ein."
"Saisissez votre numéro de TVA.": "Geben Sie Ihre Umsatzsteuer-Identifikationsnummer ein."
"Saisissez votre SIRET.": "Geben Sie Ihre SIRET-Nummer ein."
"Session d'invité manquante.": "Die Gastsitzung fehlt."
"Votre message ne doit pas dépasser {{ limit }} caractères.": "Ihre Nachricht darf höchstens {{ limit }} Zeichen lang sein."
