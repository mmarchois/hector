name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (make check, make test)
    runs-on: ubuntu-latest
    env:
      # Pas de TTY sur le runner : `docker compose exec` sans -T échouerait
      BIN_SHELL: docker compose exec -T php
    steps:
      - uses: actions/checkout@v4

      # Le conteneur PHP tourne sous l'utilisateur 1000, le dépôt extrait appartient au runner
      - name: Give the PHP container write access to the workspace
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Build and start containers
        run: docker compose up -d --build --wait

      - name: Install dependencies, JWT keys and databases
        run: |
          make install_deps BIN_SHELL="$BIN_SHELL"
          make jwt_keys BIN_SHELL="$BIN_SHELL"
          make dbinstall BIN_SHELL="$BIN_SHELL"

      - name: make check
        run: make check BIN_SHELL="$BIN_SHELL"

      - name: make test
        run: make test BIN_SHELL="$BIN_SHELL"

  mobile:
    name: Mobile (flutter analyze, flutter test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Version du poste de développement au 24 novembre 2026
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: make mobile_install

      - name: make mobile_test
        run: make mobile_test
