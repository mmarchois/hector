volumes:
  database-17: {}

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hector
      POSTGRES_PASSWORD: hector
      POSTGRES_USER: hector
    ports:
      - '5432:5432'
    volumes:
      - 'database-17:/var/lib/postgresql/data:rw'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hector -d hector']
      interval: 2s
      timeout: 3s
      retries: 30

  php:
    build:
      context: ./docker/php
    volumes:
      - ./:/var/www/hector
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      database:
        # `make install` enchaîne sur les migrations : la base doit accepter les connexions
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    ports:
      - '8003:80'
    volumes:
      - ./:/var/www/hector
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
