gesdinet_jwt_refresh_token:
    refresh_token_class: App\Infrastructure\Security\RefreshToken
    ttl: 2592000 # 30 jours
    single_use: true # rotation : chaque refresh invalide l'ancien token
    # Seule l'empreinte du token est stockée : une copie de la base ne permet pas de se connecter
    hash_tokens:
        enabled: true
        accept_stored_in_the_clear: false
