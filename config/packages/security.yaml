security:
    password_hashers:
        App\Infrastructure\Security\User\SecurityUser: 'auto'

    providers:
        app_user_provider:
            id: App\Infrastructure\Security\Provider\UserProvider

    # API 100 % stateless : aucune session, authentification par JWT (Bearer).
    firewalls:
        api_login:
            pattern: ^/api/v1/auth/login$
            stateless: true
            provider: app_user_provider
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Renouvellement (rotation single_use) et révocation du refresh token à la déconnexion
        api_token:
            pattern: ^/api/v1/auth/token/(refresh|invalidate)$
            stateless: true
            provider: app_user_provider
            refresh_jwt:
                check_path: api_auth_token_refresh
            logout:
                path: api_auth_token_invalidate

        api:
            pattern: ^/api/v1/
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        # register reste public : appelée avec le jeton d'un invité, elle convertit ce compte
        - { path: ^/api/v1/auth/(login|register|guest|token/refresh|token/invalidate)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/(doc|terms-of-use)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hachage volontairement peu coûteux en test (rapidité)
            App\Infrastructure\Security\User\SecurityUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
