framework:
    # Langues ouvertes (décision D19). En ajouter une : traductions de l'API (translations/),
    # textes de l'application (mobile/lib/l10n), consigne de langue (resources/prompts),
    # mots du contrôle des réponses (ProvisionReference) avec leurs cas critiques, cas
    # d'évaluation. Une langue n'est ouverte que si le contrôle des réponses la couvre.
    default_locale: fr
    enabled_locales: ['fr', 'en']
    # La langue d'une requête est celle de l'application, envoyée dans Accept-Language
    set_locale_from_accept_language: true
    set_content_language_from_locale: true
    translator:
        default_path: '%kernel.project_dir%/translations'
        # Le texte français sert de clé : sans traduction, il s'affiche tel quel
        fallbacks: ['fr']
