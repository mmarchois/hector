framework:
    rate_limiter:
        # Création de compte : limite par adresse IP
        registration:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

when@test:
    framework:
        cache:
            pools:
                # Compteurs remis à zéro à chaque démarrage du kernel de test
                cache.rate_limiter:
                    adapter: cache.adapter.array
        rate_limiter:
            registration:
                policy: 'fixed_window'
                limit: 1000
                interval: '1 minute'
