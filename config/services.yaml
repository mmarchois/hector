# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    # Version des conditions d'utilisation (resources/legal/terms-of-use.md) : à changer avec le texte
    app.terms_of_use.version: '2026-11-24'
    # Allocation gratuite (question P10) : valeurs PROVISOIRES, à fixer sur le coût mesuré d'un tour
    app.free_allowance.guest_messages: 10
    app.free_allowance.account_messages_per_day: 30
    # Même allocation, comptée en jetons (entrée, sortie et cache) : borne le coût d'un compte
    # dont les échanges sont longs. PROVISOIRE, comme les nombres de messages
    app.free_allowance.guest_tokens: 150000
    app.free_allowance.account_tokens_per_day: 500000

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Toutes les données rattachées à un utilisateur par les autres contextes
            iterable $userOwnedData: !tagged_iterator app.user_owned_data
            # Méthodes d'extraction du texte d'un document (décision D14)
            iterable $textExtractors: !tagged_iterator app.text_extractor

    _instanceof:
        App\Application\User\Port\UserOwnedDataInterface:
            tags: ['app.user_owned_data']
        App\Application\Knowledge\Port\TextExtractorInterface:
            tags: ['app.text_extractor']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Infrastructure/Persistence/Doctrine/Fixtures'
            - '../src/Infrastructure/Persistence/Doctrine/Mapping'
            - '../src/Infrastructure/Persistence/Doctrine/Migrations'
            - '../src/Kernel.php'

    # ------------
    # Controllers
    # ------------
    App\Infrastructure\Controller\:
        resource: '../src/Infrastructure/Controller/'
        # Les DTO et les exceptions HTTP ne sont pas des contrôleurs (instanciés à la main)
        exclude:
            - '../src/Infrastructure/Controller/**/Dto/'
            - '../src/Infrastructure/Controller/Api/ViolationHttpException.php'
            - '../src/Infrastructure/Controller/Api/ReasonHttpException.php'
        tags: ['controller.service_arguments']

    App\Application\Conversation\Service\FreeAllowancePolicy:
        arguments:
            $guestMessages: '%app.free_allowance.guest_messages%'
            $accountMessagesPerDay: '%app.free_allowance.account_messages_per_day%'
            $guestTokens: '%app.free_allowance.guest_tokens%'
            $accountTokensPerDay: '%app.free_allowance.account_tokens_per_day%'

    App\Application\Conversation\Service\GlobalTokenBudget:
        arguments:
            $tokensPerDay: '%env(int:CHAT_DAILY_TOKEN_BUDGET)%'

    # Fichiers d'origine de la base documentaire (décision D10)
    App\Infrastructure\Adapter\Knowledge\LocalFileStorage:
        arguments:
            $directory: '%env(resolve:KNOWLEDGE_STORAGE_DIR)%'

    # ----------------------
    # Évaluation (make eval)
    # ----------------------
    # Le juge a son propre modèle, fixe d'une mesure à l'autre : on compare des modèles
    # candidats (CHAT_MODEL) avec le même juge
    app.evaluation.judge_model:
        class: App\Infrastructure\Adapter\Llm\Anthropic\AnthropicChatModel
        arguments:
            $model: '%env(EVAL_JUDGE_MODEL)%'
            $effort: '%env(EVAL_JUDGE_EFFORT)%'

    App\Infrastructure\Evaluation\Judge:
        arguments:
            $judgeModel: '@app.evaluation.judge_model'

    App\Infrastructure\Evaluation\Pricing:
        factory: ['App\Infrastructure\Evaluation\Pricing', 'fromFile']
        arguments: ['%kernel.project_dir%/resources/evaluation/pricing.json']

    # -------------------
    # Command & Query bus
    # -------------------
    App\Infrastructure\Adapter\QueryBus:
        $queryBus: '@messenger.bus.queries'

    App\Infrastructure\Adapter\CommandBus:
        $commandBus: '@messenger.bus.commands'

    command_handlers:
        namespace: App\Application\
        resource: '%kernel.project_dir%/src/Application/**/Command/**/*Handler.php'
        public: true
        tags:
            - { name: 'messenger.message_handler', bus: 'messenger.bus.commands' }

    query_handlers:
        namespace: App\Application\
        resource: '%kernel.project_dir%/src/Application/**/Query/**/*Handler.php'
        public: true
        tags:
            - { name: 'messenger.message_handler', bus: 'messenger.bus.queries' }

when@dev:
    services:
        # Fixtures chargées en dev (exclues par défaut : la classe Fixture n'existe pas en prod)
        App\Infrastructure\Persistence\Doctrine\Fixtures\:
            resource: '../src/Infrastructure/Persistence/Doctrine/Fixtures/'
            autowire: true
            tags: ['doctrine.fixture.orm']

when@test:
    parameters:
        app.free_allowance.guest_messages: 3
        app.free_allowance.account_messages_per_day: 5
        app.free_allowance.guest_tokens: 50000
        app.free_allowance.account_tokens_per_day: 100000

    services:
        # Faux modèle de langage scriptable : make test n'appelle jamais le fournisseur
        App\Tests\Support\FakeChatModel:
            public: true
        App\Application\Conversation\Port\ChatModelInterface: '@App\Tests\Support\FakeChatModel'
        app.evaluation.judge_model: '@App\Tests\Support\FakeChatModel'

        # Accessible aux tests d'intégration de la recherche, même sans autre service qui l'utilise
        App\Application\Knowledge\Port\PassageSearchInterface:
            alias: App\Infrastructure\Adapter\Knowledge\PostgresPassageSearch
            public: true

        App\Infrastructure\Persistence\Doctrine\Fixtures\:
            resource: '../src/Infrastructure/Persistence/Doctrine/Fixtures/'
            autowire: true
            tags: ['doctrine.fixture.orm']
