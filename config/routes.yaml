controllers:
    resource: ../src/Infrastructure/Controller/
    type: attribute

# Routes d'authentification : interceptées par les authenticators du firewall
# (json_login / refresh_jwt / logout), aucun contrôleur nécessaire.
api_auth_login:
    path: /api/v1/auth/login
    methods: POST

api_auth_token_refresh:
    path: /api/v1/auth/token/refresh
    methods: POST

api_auth_token_invalidate:
    path: /api/v1/auth/token/invalidate
    methods: POST

# Spec OpenAPI (JSON) : source du client mobile.
api_doc:
    path: /api/v1/doc
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger }

# Interface Swagger (lecture humaine).
api_doc_ui:
    path: /api/doc
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }
